[project]
name = "gerbil-vocalization-analysis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.21",
    "librosa>=0.11.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pyarrow>=24.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "vocalpy==0.9.3",
]

[project.scripts]
gerbil-average-audio = "scripts.pipeline.average_audio:main"
gerbil-rms-assignment = "scripts.pipeline.rms_assignment:main"

[tool.setuptools.packages.find]
# `scripts` is installed too, so scripts/ modules import each other by name
# instead of bootstrapping sys.path. Only dirs with an __init__.py are picked
# up, so scripts/analysis and scripts/utils stay out until they get one.
include = ["vocalization_analysis*", "scripts*"]

[tool.setuptools.package-data]
# experiments.toml is the experiment-id -> date-folder mapping; it must ship
# with the package, not just exist in the source tree.
"scripts.pipeline" = ["*.toml"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
